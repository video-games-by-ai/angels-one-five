<text x="656" y="136" font-size="15" font-weight="600" fill="#fbf4e6" text-anchor="start" opacity="1.0">You: always in the centre.</text>
<text x="656" y="156" font-size="13.5" font-weight="400" fill="#e6d8bf" text-anchor="start" opacity="1.0">The short tick is where the nose points.</text>
