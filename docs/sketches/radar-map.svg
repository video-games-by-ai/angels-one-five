<text x="656" y="390" font-size="15" font-weight="600" fill="#fbf4e6" text-anchor="start" opacity="1.0">Range rings every 1.5 km.</text>
<text x="656" y="410" font-size="13.5" font-weight="400" fill="#e6d8bf" text-anchor="start" opacity="1.0">The map itself stays still, north at the top.</text>
