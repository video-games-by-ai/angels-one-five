<text x="656" y="252" font-size="15" font-weight="600" fill="#fbf4e6" text-anchor="start" opacity="1.0">Enemy</text>
<circle cx="622" cy="287" r="6.5" fill="#fbf4e6"/>
<text x="656" y="292" font-size="15" font-weight="600" fill="#fbf4e6" text-anchor="start" opacity="1.0">Friend</text>
