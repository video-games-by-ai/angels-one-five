<text x="656" y="448" font-size="15" font-weight="600" fill="#fbf4e6" text-anchor="start" opacity="1.0">Sweep: one turn every 3 seconds.</text>
<text x="656" y="468" font-size="13.5" font-weight="400" fill="#e6d8bf" text-anchor="start" opacity="1.0">A dot glows briefly as the line passes it.</text>
<text x="604" y="518" font-size="11.5" font-weight="400" fill="#e6d8bf" text-anchor="start" opacity="0.9">About 210 px across at 1080p · 30% dark fill, so the valley shows through it</text>
